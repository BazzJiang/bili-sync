name: Build Desktop Tray

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - desktop-tray
    paths:
      - "desktop-tray/**"
      - ".github/workflows/desktop-tray.yaml"
  pull_request:
    paths:
      - "desktop-tray/**"
      - ".github/workflows/desktop-tray.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: desktop-tray

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # 版本取自仓库根的 rust-toolchain.toml
      - run: rustup install && rustup component add rustfmt clippy

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tray
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            artifact: bili-sync-tray-macos-aarch64
          - name: macOS-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            artifact: bili-sync-tray-macos-x86_64
          - name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bili-sync-tray-windows-x86_64
          - name: Linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: bili-sync-tray-linux-x86_64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - run: rustup install && rustup target add ${{ matrix.target }}

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tray
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 注意：tray-icon 使用 ksni 后端，Linux 侧不需要 GTK/libappindicator 的 C 依赖。
      # 如果未来有人把 tray-icon 切回 libappindicator，这里要补 libgtk-3-dev / libayatana-appindicator3-dev。
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package as archive
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/bili-sync-tray.exe dist/
            7z a ${{ matrix.artifact }}.zip ./dist/bili-sync-tray.exe
          else
            cp target/${{ matrix.target }}/release/bili-sync-tray dist/
            tar czf ${{ matrix.artifact }}.tar.gz -C dist bili-sync-tray
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop-tray/${{ matrix.artifact }}.*
